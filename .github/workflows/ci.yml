name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "apps/**/*.ts" "libs/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          set -e
          timeout=120
          elapsed=0
          interval=5

          services=$(docker compose config --services)

          while true; do
            all_ready=true

            for service in $services; do
              container_id=$(docker compose ps -q "$service")

              if [ -z "$container_id" ]; then
                all_ready=false
                break
              fi

              has_healthcheck=$(docker inspect --format='{{if .State.Health}}yes{{else}}no{{end}}' "$container_id")

              if [ "$has_healthcheck" = "yes" ]; then
                status=$(docker inspect --format='{{.State.Health.Status}}' "$container_id")
                if [ "$status" != "healthy" ]; then
                  all_ready=false
                fi
              else
                status=$(docker inspect --format='{{.State.Status}}' "$container_id")
                if [ "$status" != "running" ]; then
                  all_ready=false
                fi
              fi
            done

            if [ "$all_ready" = "true" ]; then
              echo "All services are ready."
              break
            fi

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for services to become healthy."
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Waiting for services to become healthy... (${elapsed}s elapsed)"
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose down -v
