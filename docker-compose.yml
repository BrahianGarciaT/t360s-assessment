version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
      POSTGRES_DB: ${ORDERS_DB_NAME}
    ports:
      - '5432:5432'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ORDERS_DB_USER} -d ${ORDERS_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    environment:
      ORDERS_HTTP_PORT: ${ORDERS_HTTP_PORT}
      ORDERS_DB_HOST: ${ORDERS_DB_HOST}
      ORDERS_DB_PORT: ${ORDERS_DB_PORT}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      AUDIT_TCP_HOST: ${AUDIT_TCP_HOST}
      AUDIT_TCP_PORT: ${AUDIT_TCP_PORT}
      API_KEY: ${API_KEY}
      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
    ports:
      - '3000:3000'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - |
          const net = require('net');
          const c = net.createConnection({ port: 3000, host: 'localhost' });
          c.on('connect', () => { c.destroy(); process.exit(0); });
          c.on('error', () => process.exit(1));
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  audit:
    build:
      context: .
      dockerfile: apps/audit/Dockerfile
    environment:
      AUDIT_HTTP_PORT: ${AUDIT_HTTP_PORT}
      AUDIT_TCP_PORT: ${AUDIT_TCP_PORT}
      AUDIT_MONGO_URI: ${AUDIT_MONGO_URI}
    ports:
      - '3001:3001'
      - '4001:4001'
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - |
          const net = require('net');
          let done = 0;
          const check = (port) => new Promise(res => {
            const c = net.createConnection({ port, host: 'localhost' });
            c.on('connect', () => { c.destroy(); done++; res(); });
            c.on('error', res);
          });
          Promise.all([check(3001), check(4001)]).then(() => process.exit(done === 2 ? 0 : 1));
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  app-network:
    driver: bridge
