services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
      POSTGRES_DB: ${ORDERS_DB_NAME}
    ports:
      - '5432:5432'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ORDERS_DB_USER} -d ${ORDERS_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - '5433:5432'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    environment:
      ORDERS_HTTP_PORT: ${ORDERS_HTTP_PORT}
      ORDERS_DB_HOST: ${ORDERS_DB_HOST}
      ORDERS_DB_PORT: ${ORDERS_DB_PORT}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      AUDIT_TCP_HOST: ${AUDIT_TCP_HOST}
      AUDIT_TCP_PORT: ${AUDIT_TCP_PORT}
      INVENTORY_TCP_HOST: ${INVENTORY_TCP_HOST}
      INVENTORY_TCP_PORT: ${INVENTORY_TCP_PORT}
      INVENTORY_SEND_TIMEOUT_MS: ${INVENTORY_SEND_TIMEOUT_MS}
      INVENTORY_BREAKER_FAILURE_THRESHOLD: ${INVENTORY_BREAKER_FAILURE_THRESHOLD}
      INVENTORY_BREAKER_RESET_TIMEOUT_MS: ${INVENTORY_BREAKER_RESET_TIMEOUT_MS}
      API_KEY: ${API_KEY}
      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS}
      OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS}
      OUTBOX_BACKOFF_BASE_MS: ${OUTBOX_BACKOFF_BASE_MS}
      OUTBOX_BACKOFF_MAX_MS: ${OUTBOX_BACKOFF_MAX_MS}
      OUTBOX_PURGE_RETENTION_DAYS: ${OUTBOX_PURGE_RETENTION_DAYS}
    ports:
      - '3000:3000'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      audit:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - |
          require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  inventory:
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
    environment:
      INVENTORY_HTTP_PORT: ${INVENTORY_HTTP_PORT}
      INVENTORY_TCP_PORT: ${INVENTORY_TCP_PORT}
      INVENTORY_DB_HOST: ${INVENTORY_DB_HOST}
      INVENTORY_DB_PORT: ${INVENTORY_DB_PORT}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_RESERVATION_TTL_MINUTES: ${INVENTORY_RESERVATION_TTL_MINUTES}
      INVENTORY_REAP_BATCH_SIZE: ${INVENTORY_REAP_BATCH_SIZE}
      API_KEY: ${API_KEY}
      AUDIT_TCP_HOST: ${AUDIT_TCP_HOST}
      AUDIT_TCP_PORT: ${AUDIT_TCP_PORT}
    ports:
      - '3002:3002'
    networks:
      - app-network
    depends_on:
      postgres-inventory:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - |
          require('http').get('http://localhost:3002/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  audit:
    build:
      context: .
      dockerfile: apps/audit/Dockerfile
    environment:
      AUDIT_HTTP_PORT: ${AUDIT_HTTP_PORT}
      AUDIT_TCP_PORT: ${AUDIT_TCP_PORT}
      AUDIT_MONGO_URI: ${AUDIT_MONGO_URI}
      API_KEY: ${API_KEY}
    ports:
      - '3001:3001'
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - |
          require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  app-network:
    driver: bridge
